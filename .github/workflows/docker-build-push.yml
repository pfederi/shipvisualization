# Image in GitHub bauen und nach GHCR pushen.
# In Coolify dann "Deploy from Registry" nutzen → kein Build auf dem Hetzner-Server, keine CPU-Last.

name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          echo "image=${{ env.REGISTRY }}/${{ github.repository }}:latest" >> $GITHUB_OUTPUT
          echo "sha=${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha
